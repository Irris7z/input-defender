<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Input Defender · ローカル検証</title><link rel="stylesheet" href="/fixture.css"><script defer src="/fixture.js"></script></head><body><main><p class="kicker">INPUT DEFENDER / LOCAL LAB</p><h1>入力値を読まずに、<br>不審な挙動を見つける。</h1><p class="lead">テスト専用のフォームです。ダミー情報だけを入力してください。通信先はこの端末内に限定し、受信データは保存せず破棄します。</p><form id="checkout" action="/collect" method="post"><label>氏名<input name="full-name" autocomplete="name" placeholder="テスト 太郎"></label><label>住所<input name="address" autocomplete="street-address" placeholder="テスト用の住所"></label><label>カード番号<input name="card-number" autocomplete="cc-number" placeholder="本物の番号は入力しないでください"></label><button type="submit" id="normal-submit">ローカルの同一オリジンへ送信</button></form><section><h2>挙動を試す</h2><p>入力後5秒以内に実行すると、APIの呼び出しと外部通信の警告を確認できます。このデモはHTTPのため、同一オリジンでも平文通信の警告が出ます。</p><div class="actions"><button id="fetch-test">外部 Fetch</button><button id="xhr-test">外部 XHR</button><button id="beacon-test">外部 Beacon</button><button id="image-test">外部画像リクエスト</button><button id="change-test">フォーム送信先を変更</button><button id="redirect-test">外部へのリダイレクト</button></div><output id="result" aria-live="polite">操作待ち</output><p class="note">各テストは固定文字列「fixture」だけを送ります。フォーム値はテスト用スクリプトでも読み取りません。</p></section></main></body></html>
